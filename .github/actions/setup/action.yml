name: Setup
description: Install pnpm, Node LTS, and dependencies from the lockfile.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
